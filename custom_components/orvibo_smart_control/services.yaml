refresh_devices:
  name: Refresh device snapshots
  description: Refresh the cloud device inventory and state snapshot for the specified
    configuration.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: true
      example: 0123456789abcdef
set_lock_user_name:
  name: Set lock user name
  description: Map a lock user ID to a readable name. An empty name clears the mapping.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: true
      example: w-example-door-lock-id
    user_id:
      name: User ID
      description: Lock user number from unlockEvent.unlock_user_id.
      required: true
      example: '2'
    name:
      name: User name
      description: Readable user name. Leave empty to clear a mapping; temporary authorizations
        generate a default name.
      required: true
      example: Guest
fetch_video:
  name: Archive lock event video
  description: Download H.264 event video and remux it to MP4 when available. The
    response contains only a media ID.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: true
      example: w-example-door-lock-id
    object_key:
      name: Video object key
      description: The event video_url, for example /uid/videoPicklockEvent/xxx.h264.
      required: true
      example: /example-device-id/videoPicklockEvent/picklockEvent_1700000000.h264
list_events:
  name: List lock media history
  description: List archived snapshots and videos, newest first, with media-browser
    references.
  target: {}
  fields:
    media_type:
      name: Media type
      description: Filter by image or video before applying the result limit.
      required: false
      selector:
        select:
          options:
          - image
          - video
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: false
      example: w-example-door-lock-id
    limit:
      name: Result limit
      description: Maximum number of returned records; default 100.
      required: false
      example: 50
cleanup_history:
  name: Clean up lock media history
  description: Delete old snapshots and videos according to the retention period and
    optional record limit.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    keep_days:
      name: Retention (days)
      description: Keep records from the last N days; default 7.
      required: false
      example: 7
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: false
      example: w-example-door-lock-id
    max_entries:
      name: Maximum records
      description: Optional maximum records per device; the oldest records are removed
        first.
      required: false
      example: 500
grant_temp_password:
  name: Create temporary lock authorization
  description: Create a temporary or time-limited authorization. The password is returned
    only in this response.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: false
      example: w-example-door-lock-id
    type:
      name: Authorization type
      description: '1: time-limited (start_time/end_time or minutes). 2: temporary
        (minutes and number; default).'
      required: false
      example: 2
    minutes:
      name: Validity (minutes)
      description: Relative duration; default 1440 minutes (24 hours).
      required: false
      example: 1440
    number:
      name: Usage limit
      description: 0 means unlimited uses; default 1 for type=2.
      required: false
      example: 1
    name:
      name: User name
      description: Readable user name. Leave empty to clear a mapping; temporary authorizations
        generate a default name.
      required: false
      example: Guest
    phone:
      name: Phone number
      description: Optional SMS recipient when creating an authorization.
      required: false
      example: '13800138000'
    start_time:
      name: Start time
      description: Unix timestamp in seconds for type=1; defaults to the current time.
      required: false
      example: 1785805200
    end_time:
      name: End time
      description: Unix timestamp in seconds for type=1; defaults to now plus minutes.
      required: false
      example: 1785978000
revoke_temp_password:
  name: Revoke temporary lock authorization
  description: Revoke a lock authorization by authorized_id.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: true
      example: w-example-door-lock-id
    authorized_id:
      name: Authorization ID
      description: authorized_id returned by creation or list_temp_passwords.
      required: true
      example: 101
list_temp_passwords:
  name: List temporary lock authorizations
  description: Query authorization metadata and expiry status without returning plaintext
    passwords.
  target: {}
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      required: false
      example: 0123456789abcdef
    device_id:
      name: Device ID
      description: Door-lock device ID, available in device information. If optional,
        leave empty to use the default device selection.
      required: false
      example: w-example-door-lock-id
inspect_video_session:
  name: Inspect video vendor session
  description: Use the existing cloud session to inspect Meari authorization. Returns
    redacted diagnostics without playing video.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      selector:
        text: null
    country_code:
      name: Country code
      default: CN
      selector:
        text: null
      description: Country code matching the video session; default CN.
    phone_code:
      name: Calling code
      default: '86'
      selector:
        text: null
      description: Country calling code; default 86.
    language:
      name: Language
      default: zh
      selector:
        select:
          options:
          - zh
          - en
      description: zh or en; protocol default zh.
inspect_video_devices:
  name: Inspect video vendor devices
  description: Query Meari device counts and capabilities. Does not connect to devices
    or play video.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      selector:
        text: null
    country_code:
      name: Country code
      default: CN
      selector:
        text: null
      description: Country code matching the video session; default CN.
    phone_code:
      name: Calling code
      default: '86'
      selector:
        text: null
      description: Country calling code; default 86.
    language:
      name: Language
      default: zh
      selector:
        select:
          options:
          - zh
          - en
      description: zh or en; protocol default zh.
inspect_video_channels:
  name: Inspect recorder channels
  description: Query Meari devices and recorder channel snapshots, returning redacted
    identifiers, states and capabilities without playing video.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      selector:
        text: null
    country_code:
      name: Country code
      default: CN
      selector:
        text: null
      description: Country code matching the video session; default CN.
    phone_code:
      name: Calling code
      default: '86'
      selector:
        text: null
      description: Country calling code; default 86.
    language:
      name: Language
      default: zh
      selector:
        select:
          options:
          - zh
          - en
      description: zh or en; protocol default zh.
probe_video_stream:
  name: Test channel video connection
  description: Connect briefly to an XTS channel and inspect keyframes. Stops after
    completion or timeout without saving video or starting playback.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Integration configuration entry ID; specify it when multiple entries
        exist.
      example: 0123456789abcdef
    device_index:
      name: Device index
      description: Index returned by inspect_video_devices; verify it after the device
        list changes.
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 512
          mode: box
    channel_id:
      name: Channel ID
      description: channel_id returned by inspect_video_channels; use 0 for an ordinary
        IP camera.
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 128
          mode: box
    timeout_seconds:
      name: Connection timeout
      description: 10–60 seconds; default 35. Cloud authorization and discovery take
        additional time.
      example: 35
      selector:
        number:
          min: 10
          max: 60
          mode: box
    country_code:
      name: Country code
      description: Country code matching the video session; default CN.
      example: CN
    phone_code:
      name: Calling code
      description: Country calling code; default 86.
      example: '86'
    language:
      name: Language
      description: zh or en; protocol default zh.
      example: zh
search_hdd_recordings:
  name: Find disk or memory-card recordings
  description: Find recording days or clips using the device calendar. The first P2P
    connection may take about a minute.
  fields:
    entity_id:
      name: Playback entity
      description: Select a camera entity named Disk playback or Memory-card playback.
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
    operation:
      name: Search scope
      default: day
      selector:
        select:
          options:
          - month
          - day
      description: Search recording days in a month or clips on a day.
    date:
      name: Device date/time
      description: 'Use the device calendar: YYYYMM for month, YYYYMMDD for day, or
        YYYYMMDDHHmmss for playback. No time-zone conversion is applied.'
      required: true
      example: '20261015'
      selector:
        text: null
start_hdd_playback:
  name: Select disk or memory-card playback time
  description: Select a start time, then open the playback camera entity. Selecting
    a new time closes the previous connection.
  fields:
    entity_id:
      name: Playback entity
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
      description: Select a camera entity named Disk playback or Memory-card playback.
    date:
      name: Device date/time
      description: 'Use the device calendar: YYYYMM for month, YYYYMMDD for day, or
        YYYYMMDDHHmmss for playback. No time-zone conversion is applied.'
      required: true
      example: '20261015090000'
      selector:
        text: null
stop_hdd_playback:
  name: Stop disk or memory-card playback
  description: Close playback and transcoding for the selected entity. Live video
    uses a separate entity.
  fields:
    entity_id:
      name: Playback entity
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
      description: Select a camera entity named Disk playback or Memory-card playback.
